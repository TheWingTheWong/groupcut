# Reproduce the README numbers on a GitHub-hosted runner. Manual trigger only:
# it downloads ~300 MB of Wikipedia pageview dumps and runs for ~10 minutes,
# three times in parallel on separate runners to show machine-to-machine spread.
name: bench

on:
  workflow_dispatch:

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: scripts/fetch-wiki.sh 20261101 12 6
      - name: Wikipedia pageviews, 6 hours, 256 partitions, checked against the reference
        run: ./target/release/groupcut wiki --reps 7 --check --json bench/wiki-gha.json data/*.gz | tee bench/wiki-gha.txt
      - name: Same, with pre-aggregation always on (the older, weaker baseline)
        run: ./target/release/groupcut wiki --reps 7 --adaptive 0 --json bench/wiki-gha-noadapt.json data/*.gz | tee bench/wiki-gha-noadapt.txt
      - name: Same, 1024 and 4096 partitions
        run: |
          ./target/release/groupcut wiki --reps 7 --partition-bits 10 --json bench/wiki-gha-p10.json data/*.gz | tee bench/wiki-gha-p10.txt
          ./target/release/groupcut wiki --reps 7 --partition-bits 12 --json bench/wiki-gha-p12.json data/*.gz | tee bench/wiki-gha-p12.txt
      - name: DuckDB on the same query, for scale
        run: |
          python3 -m pip install --quiet duckdb
          python3 scripts/duckdb_compare.py --threads "$(nproc)" data/*.gz | tee bench/duckdb-gha.txt
      - name: ClickBench Q16 on the first 20 of 100 hits partitions (~2.4 GB)
        run: |
          python3 -m pip install --quiet duckdb numpy
          python3 scripts/clickbench_q16.py --files 20 --threads "$(nproc)" | tee bench/q16-duckdb-gha.txt
          ./target/release/groupcut keys --reps 7 --check --json bench/q16-gha.json data/q16.u64 | tee bench/q16-gha.txt
          ./target/release/groupcut keys --reps 7 --slot-bits 8 --json bench/q16-gha-s8.json data/q16.u64 | tee bench/q16-gha-s8.txt
          ./target/release/groupcut keys --reps 7 --partition-bits 12 --json bench/q16-gha-p12.json data/q16.u64 | tee bench/q16-gha-p12.txt
          rm -rf data/clickbench
      - name: Demo
        run: ./target/release/groupcut demo | tee bench/demo-gha.txt
      - name: Synthetic sweeps
        run: ./target/release/groupcut bench --reps 5 --out bench/results-gha.json | tee bench/results-gha.txt
      - name: Summary
        run: |
          for f in bench/*-gha*.txt; do echo "## $f"; echo '```'; cat "$f"; echo '```'; done >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: bench-results-${{ matrix.runner }}
          path: bench/*-gha*
